name: Jay FM Generator

on:
  schedule:
    - cron: '30 23 * * *'  # 5:00 AM IST - rhythms, rasi_palan
    - cron: '45 23 * * *'  # 5:15 AM IST - morning_news, thalaivar
    - cron: '0 0 * * *'    # 5:30 AM IST - health, movie_review
    - cron: '15 0 * * *'   # 5:45 AM IST - agriculture, travel
    - cron: '30 0 * * *'   # 6:00 AM IST - morning audio
    - cron: '30 8 * * *'   # 2:00 PM IST - local_news, weather
    - cron: '45 8 * * *'   # 2:15 PM IST - comedy, science
    - cron: '0 9 * * *'    # 2:30 PM IST - evening_news, horror
    - cron: '15 9 * * *'   # 2:45 PM IST - love, night, night_music
    - cron: '30 9 * * *'   # 3:00 PM IST - afternoon audio
  workflow_dispatch:
    inputs:
      task:
        description: 'Task to run'
        required: true
        default: 'morning1'
        type: choice
        options:
          - morning1
          - morning2
          - morning3
          - morning4
          - morning_audio
          - afternoon1
          - afternoon2
          - afternoon3
          - afternoon4
          - afternoon_audio

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Setup credentials
        run: |
          echo "$GOOGLE_SERVICE_ACCOUNT" | base64 --decode > google-services-admin.json
          echo "GEMINI_API_KEY=$GEMINI_API_KEY" > .env
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_B64 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Morning 1 - rhythms, rasi_palan
        if: github.event.schedule == '30 23 * * *' || github.event.inputs.task == 'morning1'
        run: |
          node scripts/generateJayFMContent.js --today --slot=rhythms
          node scripts/generateJayFMContent.js --today --slot=rasi_palan

      - name: Morning 2 - morning_news, thalaivar
        if: github.event.schedule == '45 23 * * *' || github.event.inputs.task == 'morning2'
        run: |
          node scripts/generateJayFMContent.js --today --slot=morning_news
          node scripts/generateJayFMContent.js --today --slot=thalaivar

      - name: Morning 3 - health, movie_review
        if: github.event.schedule == '0 0 * * *' || github.event.inputs.task == 'morning3'
        run: |
          node scripts/generateJayFMContent.js --today --slot=health
          node scripts/generateJayFMContent.js --today --slot=movie_review

      - name: Morning 4 - agriculture, travel
        if: github.event.schedule == '15 0 * * *' || github.event.inputs.task == 'morning4'
        run: |
          node scripts/generateJayFMContent.js --today --slot=agriculture
          node scripts/generateJayFMContent.js --today --slot=travel

      - name: Morning Audio
        if: github.event.schedule == '30 0 * * *' || github.event.inputs.task == 'morning_audio'
        run: node scripts/generateFMAudio.js --today --morning

      - name: Afternoon 1 - local_news, weather
        if: github.event.schedule == '30 8 * * *' || github.event.inputs.task == 'afternoon1'
        run: |
          node scripts/generateJayFMContent.js --today --slot=local_news
          node scripts/generateJayFMContent.js --today --slot=weather

      - name: Afternoon 2 - comedy, science
        if: github.event.schedule == '45 8 * * *' || github.event.inputs.task == 'afternoon2'
        run: |
          node scripts/generateJayFMContent.js --today --slot=comedy
          node scripts/generateJayFMContent.js --today --slot=science

      - name: Afternoon 3 - evening_news, horror
        if: github.event.schedule == '0 9 * * *' || github.event.inputs.task == 'afternoon3'
        run: |
          node scripts/generateJayFMContent.js --today --slot=evening_news
          node scripts/generateJayFMContent.js --today --slot=horror

      - name: Afternoon 4 - love, night, night_music
        if: github.event.schedule == '15 9 * * *' || github.event.inputs.task == 'afternoon4'
        run: |
          node scripts/generateJayFMContent.js --today --slot=love
          node scripts/generateJayFMContent.js --today --slot=night
          node scripts/generateJayFMContent.js --today --slot=night_music

      - name: Afternoon Audio
        if: github.event.schedule == '30 9 * * *' || github.event.inputs.task == 'afternoon_audio'
        run: node scripts/generateFMAudio.js --today --afternoon