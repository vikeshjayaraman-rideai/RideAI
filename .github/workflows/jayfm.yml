name: Jay FM Generator

on:
  schedule:
    - cron: '30 23 * * *'
    - cron: '0 0 * * *'
    - cron: '30 5 * * *'
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      task:
        description: 'Task to run'
        required: true
        default: 'morning_content'
        type: choice
        options:
          - morning_content
          - morning_audio
          - afternoon_content
          - afternoon_audio

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Setup credentials
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "$GOOGLE_SERVICE_ACCOUNT" > google-services-admin.json
          echo "GEMINI_API_KEY=$GEMINI_API_KEY" > .env

      - name: Debug - check files
        run: |
          ls scripts/
          echo "Config check:"
          node -e "const c = require('./scripts/jayFMConfig'); console.log('Config OK, slots:', c.SCHEDULE?.length);"

      - name: Morning Content
        if: github.event.schedule == '30 23 * * *' || github.event.inputs.task == 'morning_content'
        run: node scripts/generateJayFMContent.js --today --morning

      - name: Morning Audio
        if: github.event.schedule == '0 0 * * *' || github.event.inputs.task == 'morning_audio'
        run: node scripts/generateFMAudio.js --today --morning

      - name: Afternoon Content
        if: github.event.schedule == '30 5 * * *' || github.event.inputs.task == 'afternoon_content'
        run: node scripts/generateJayFMContent.js --today --afternoon

      - name: Afternoon Audio
        if: github.event.schedule == '0 6 * * *' || github.event.inputs.task == 'afternoon_audio'
        run: node scripts/generateFMAudio.js --today --afternoon